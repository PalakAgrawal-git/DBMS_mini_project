<!-- ============================ SCHEMA (same as schema.sql) ============================ -->
<script id="schema-sql" type="text/plain">
PRAGMA foreign_keys = ON;

CREATE TABLE User (
    user_id INTEGER PRIMARY KEY AUTOINCREMENT,
    username TEXT NOT NULL UNIQUE,
    password_hash TEXT NOT NULL,
    role TEXT NOT NULL CHECK (role IN ('Citizen','Officer','Administrator')),
    full_name TEXT NOT NULL,
    email TEXT UNIQUE,
    created_at TEXT NOT NULL DEFAULT (datetime('now'))
);
CREATE TABLE Region (
    region_id INTEGER PRIMARY KEY AUTOINCREMENT,
    name TEXT NOT NULL UNIQUE,
    state TEXT NOT NULL,
    population INTEGER CHECK (population >= 0)
);
CREATE TABLE HeatwaveSeverity (
    severity_id INTEGER PRIMARY KEY AUTOINCREMENT,
    level TEXT NOT NULL UNIQUE CHECK (level IN ('Low','Moderate','High','Extreme')),
    rank INTEGER NOT NULL UNIQUE,
    description TEXT
);
CREATE TABLE GovernmentDepartment (
    dept_id INTEGER PRIMARY KEY AUTOINCREMENT,
    name TEXT NOT NULL UNIQUE,
    description TEXT,
    contact TEXT
);
CREATE TABLE Citizen (
    citizen_id INTEGER PRIMARY KEY AUTOINCREMENT,
    user_id INTEGER NOT NULL UNIQUE,
    region_id INTEGER NOT NULL,
    phone TEXT, address TEXT,
    FOREIGN KEY (user_id) REFERENCES User(user_id) ON DELETE CASCADE,
    FOREIGN KEY (region_id) REFERENCES Region(region_id) ON DELETE RESTRICT
);
CREATE TABLE Officer (
    officer_id INTEGER PRIMARY KEY AUTOINCREMENT,
    user_id INTEGER NOT NULL UNIQUE,
    dept_id INTEGER NOT NULL,
    designation TEXT,
    FOREIGN KEY (user_id) REFERENCES User(user_id) ON DELETE CASCADE,
    FOREIGN KEY (dept_id) REFERENCES GovernmentDepartment(dept_id) ON DELETE RESTRICT
);
CREATE TABLE Administrator (
    admin_id INTEGER PRIMARY KEY AUTOINCREMENT,
    user_id INTEGER NOT NULL UNIQUE,
    office TEXT,
    FOREIGN KEY (user_id) REFERENCES User(user_id) ON DELETE CASCADE
);
CREATE TABLE WeatherStation (
    station_id INTEGER PRIMARY KEY AUTOINCREMENT,
    region_id INTEGER NOT NULL,
    name TEXT NOT NULL, latitude REAL, longitude REAL,
    installed_on TEXT DEFAULT (date('now')),
    FOREIGN KEY (region_id) REFERENCES Region(region_id) ON DELETE CASCADE
);
CREATE TABLE WeatherObservation (
    obs_id INTEGER PRIMARY KEY AUTOINCREMENT,
    station_id INTEGER NOT NULL,
    temperature REAL NOT NULL,
    humidity REAL NOT NULL CHECK (humidity BETWEEN 0 AND 100),
    wind_speed REAL NOT NULL CHECK (wind_speed >= 0),
    observed_at TEXT NOT NULL DEFAULT (datetime('now')),
    recorded_by INTEGER,
    FOREIGN KEY (station_id) REFERENCES WeatherStation(station_id) ON DELETE CASCADE,
    FOREIGN KEY (recorded_by) REFERENCES User(user_id) ON DELETE SET NULL
);
CREATE TABLE HeatwavePrediction (
    prediction_id INTEGER PRIMARY KEY AUTOINCREMENT,
    region_id INTEGER NOT NULL, obs_id INTEGER,
    severity_id INTEGER NOT NULL,
    temperature REAL NOT NULL, humidity REAL NOT NULL, wind_speed REAL NOT NULL,
    reason TEXT, predicted_at TEXT NOT NULL DEFAULT (datetime('now')),
    FOREIGN KEY (region_id) REFERENCES Region(region_id) ON DELETE CASCADE,
    FOREIGN KEY (obs_id) REFERENCES WeatherObservation(obs_id) ON DELETE SET NULL,
    FOREIGN KEY (severity_id) REFERENCES HeatwaveSeverity(severity_id) ON DELETE RESTRICT
);
CREATE TABLE Advisory (
    advisory_id INTEGER PRIMARY KEY AUTOINCREMENT,
    severity_id INTEGER NOT NULL, message TEXT NOT NULL,
    FOREIGN KEY (severity_id) REFERENCES HeatwaveSeverity(severity_id) ON DELETE CASCADE
);
CREATE TABLE WarningAlert (
    alert_id INTEGER PRIMARY KEY AUTOINCREMENT,
    region_id INTEGER NOT NULL, prediction_id INTEGER, severity_id INTEGER NOT NULL,
    message TEXT NOT NULL, issued_at TEXT NOT NULL DEFAULT (datetime('now')),
    is_active INTEGER NOT NULL DEFAULT 1 CHECK (is_active IN (0,1)),
    FOREIGN KEY (region_id) REFERENCES Region(region_id) ON DELETE CASCADE,
    FOREIGN KEY (prediction_id) REFERENCES HeatwavePrediction(prediction_id) ON DELETE SET NULL,
    FOREIGN KEY (severity_id) REFERENCES HeatwaveSeverity(severity_id) ON DELETE RESTRICT
);
CREATE TABLE Complaint (
    complaint_id INTEGER PRIMARY KEY AUTOINCREMENT,
    citizen_id INTEGER NOT NULL, region_id INTEGER NOT NULL,
    dept_id INTEGER, assigned_officer_id INTEGER,
    category TEXT NOT NULL, description TEXT NOT NULL,
    status TEXT NOT NULL DEFAULT 'Open' CHECK (status IN ('Open','In Progress','Resolved')),
    created_at TEXT NOT NULL DEFAULT (datetime('now')), resolved_at TEXT,
    FOREIGN KEY (citizen_id) REFERENCES Citizen(citizen_id) ON DELETE CASCADE,
    FOREIGN KEY (region_id) REFERENCES Region(region_id) ON DELETE RESTRICT,
    FOREIGN KEY (dept_id) REFERENCES GovernmentDepartment(dept_id) ON DELETE SET NULL,
    FOREIGN KEY (assigned_officer_id) REFERENCES Officer(officer_id) ON DELETE SET NULL
);
CREATE TABLE Notification (
    notification_id INTEGER PRIMARY KEY AUTOINCREMENT,
    user_id INTEGER NOT NULL, message TEXT NOT NULL,
    is_read INTEGER NOT NULL DEFAULT 0 CHECK (is_read IN (0,1)),
    created_at TEXT NOT NULL DEFAULT (datetime('now')),
    FOREIGN KEY (user_id) REFERENCES User(user_id) ON DELETE CASCADE
);

-- TRIGGER: auto-create a WarningAlert for High/Extreme predictions
CREATE TRIGGER trg_prediction_autowarn
AFTER INSERT ON HeatwavePrediction
FOR EACH ROW
WHEN (SELECT rank FROM HeatwaveSeverity WHERE severity_id = NEW.severity_id) >= 3
BEGIN
    INSERT INTO WarningAlert (region_id, prediction_id, severity_id, message, issued_at, is_active)
    VALUES (NEW.region_id, NEW.prediction_id, NEW.severity_id,
        'HEATWAVE WARNING (' || (SELECT level FROM HeatwaveSeverity WHERE severity_id = NEW.severity_id) ||
        '): Recorded ' || NEW.temperature || ' C in ' ||
        (SELECT name FROM Region WHERE region_id = NEW.region_id) || '. Take precautions.',
        NEW.predicted_at, 1);
END;

-- VIEW: region-wise complaint summary
CREATE VIEW v_region_complaint_summary AS
SELECT r.region_id, r.name AS region_name,
    COUNT(c.complaint_id) AS total_complaints,
    SUM(CASE WHEN c.status='Open' THEN 1 ELSE 0 END) AS open_complaints,
    SUM(CASE WHEN c.status='In Progress' THEN 1 ELSE 0 END) AS in_progress_complaints,
    SUM(CASE WHEN c.status='Resolved' THEN 1 ELSE 0 END) AS resolved_complaints
FROM Region r LEFT JOIN Complaint c ON c.region_id = r.region_id
GROUP BY r.region_id, r.name;
</script>

<script>
let db = null;
let currentUser = null;   // {user_id, role, full_name, ...}

// ---- Rule-based expert system (mirrors expert_system.py) ----
const ADVISORIES = {
  Low:      ["Conditions are normal. Stay aware of weather updates."],
  Moderate: ["Stay hydrated and drink water regularly.",
             "Limit strenuous outdoor activity during the afternoon."],
  High:     ["Avoid outdoor activity between 11am and 4pm.",
             "Drink plenty of water; avoid alcohol and caffeine.",
             "Check on elderly relatives and young children."],
  Extreme:  ["Do NOT go outdoors between 11am and 4pm unless absolutely necessary.",
             "Stay hydrated; carry water at all times.",
             "Watch for signs of heat stroke (dizziness, nausea, confusion).",
             "Keep pets and vulnerable people in cool, ventilated spaces."]
};
function classifySeverity(t, h) {
  t = parseFloat(t); h = parseFloat(h);
  if (t >= 45) return ["Extreme", `Rule: temperature ${t} C >= 45 C.`];
  if (t >= 40 && h <= 20) return ["Extreme", `Rule: temperature ${t} C >= 40 C AND humidity ${h}% <= 20% (dry heat).`];
  if (t >= 40) return ["High", `Rule: temperature ${t} C >= 40 C.`];
  if (t >= 35) return ["Moderate", `Rule: temperature ${t} C >= 35 C.`];
  return ["Low", `Rule: temperature ${t} C is below 35 C.`];
}

// ---- DB helpers ----
function run(sql, params=[]) {
  const stmt = db.prepare(sql);
  stmt.bind(params);
  const rows = [];
  while (stmt.step()) rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
}
function one(sql, params=[]) { const r = run(sql, params); return r.length ? r[0] : null; }
function exec(sql, params=[]) { const stmt = db.prepare(sql); stmt.bind(params); stmt.step(); stmt.free(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---- Seed data ----
function seed() {
  const sev = [["Low",1,"Normal conditions; no significant heat risk."],
    ["Moderate",2,"Elevated temperatures; take basic precautions."],
    ["High",3,"Dangerous heat; avoid midday exposure."],
    ["Extreme",4,"Life-threatening heat; stay indoors, high alert."]];
  sev.forEach(s => exec("INSERT INTO HeatwaveSeverity (level,rank,description) VALUES (?,?,?)", s));
  const sevId = {}; run("SELECT * FROM HeatwaveSeverity").forEach(r => sevId[r.level]=r.severity_id);

  const regions = [["Nagpur","Maharashtra",2500000],["Vidarbha East","Maharashtra",900000],
    ["Akola","Maharashtra",600000],["Chandrapur","Maharashtra",450000]];
  regions.forEach(r => exec("INSERT INTO Region (name,state,population) VALUES (?,?,?)", r));
  const regId = {}; run("SELECT * FROM Region").forEach(r => regId[r.name]=r.region_id);

  const depts = [["Water Supply","Manages drinking water and tanker distribution.","1800-111-222"],
    ["Health","Handles heat-illness response and hospitals.","1800-333-444"],
    ["Electricity Board","Power supply and outage response.","1800-555-666"],
    ["Disaster Management","Coordinates emergency heatwave response.","1800-777-888"]];
  depts.forEach(d => exec("INSERT INTO GovernmentDepartment (name,description,contact) VALUES (?,?,?)", d));
  const deptId = {}; run("SELECT * FROM GovernmentDepartment").forEach(r => deptId[r.name]=r.dept_id);

  for (const [level, msgs] of Object.entries(ADVISORIES))
    msgs.forEach(m => exec("INSERT INTO Advisory (severity_id,message) VALUES (?,?)", [sevId[level], m]));

  const H = "demo";  // placeholder hash; login is simulated in the static demo
  function addUser(u, role, name, email){ exec("INSERT INTO User (username,password_hash,role,full_name,email) VALUES (?,?,?,?,?)",[u,H,role,name,email]); return one("SELECT last_insert_rowid() AS id").id; }

  const adminU = addUser("admin","Administrator","System Administrator","admin@heatgov.in");
  exec("INSERT INTO Administrator (user_id,office) VALUES (?,?)",[adminU,"State Disaster Cell"]);

  const off1U = addUser("officer1","Officer","Anil Deshmukh","anil@heatgov.in");
  exec("INSERT INTO Officer (user_id,dept_id,designation) VALUES (?,?,?)",[off1U,deptId["Water Supply"],"Water Supply Officer"]);
  const off1 = one("SELECT last_insert_rowid() AS id").id;
  const off2U = addUser("officer2","Officer","Meena Kulkarni","meena@heatgov.in");
  exec("INSERT INTO Officer (user_id,dept_id,designation) VALUES (?,?,?)",[off2U,deptId["Health"],"Health Officer"]);
  const off2 = one("SELECT last_insert_rowid() AS id").id;

  const citSpec = [["priya","Priya Sharma","priya@example.com","Nagpur","9800000001","12 MG Road, Nagpur"],
    ["rahul","Rahul Verma","rahul@example.com","Vidarbha East","9800000002","5 Station Rd"],
    ["sana","Sana Khan","sana@example.com","Akola","9800000003","88 Civil Lines, Akola"],
    ["dev","Dev Patel","dev@example.com","Chandrapur","9800000004","3 Market Ln"]];
  const citId = {};
  citSpec.forEach(([u,n,e,reg,ph,ad]) => {
    const uid = addUser(u,"Citizen",n,e);
    exec("INSERT INTO Citizen (user_id,region_id,phone,address) VALUES (?,?,?,?)",[uid,regId[reg],ph,ad]);
    citId[u] = one("SELECT last_insert_rowid() AS id").id;
  });

  const stSpec = [["Nagpur","Nagpur Central AWS",21.1458,79.0882],["Nagpur","Nagpur Airport AWS",21.0922,79.0472],
    ["Vidarbha East","Vidarbha East AWS",20.9320,79.9500],["Akola","Akola City AWS",20.7000,77.0000],
    ["Chandrapur","Chandrapur AWS",19.9615,79.2961]];
  const stId = {};
  stSpec.forEach(([reg,n,la,lo]) => { exec("INSERT INTO WeatherStation (region_id,name,latitude,longitude) VALUES (?,?,?,?)",[regId[reg],n,la,lo]); stId[n]=one("SELECT last_insert_rowid() AS id").id; });

  const obsSpec = [["Nagpur Central AWS",47.0,18,8,0,true],["Nagpur Central AWS",44.0,25,6,1,true],
    ["Nagpur Central AWS",41.0,30,5,2,true],["Nagpur Airport AWS",46.5,15,10,0,false],
    ["Vidarbha East AWS",41.0,35,7,0,true],["Vidarbha East AWS",38.0,40,6,2,true],
    ["Akola City AWS",36.5,45,9,0,true],["Akola City AWS",34.0,55,8,3,true],
    ["Chandrapur AWS",33.0,60,12,0,true]];
  obsSpec.forEach(([st,t,h,w,days,mk]) => {
    const sid = stId[st];
    exec(`INSERT INTO WeatherObservation (station_id,temperature,humidity,wind_speed,observed_at,recorded_by) VALUES (?,?,?,?, datetime('now','-${days} days'), ?)`,[sid,t,h,w,off1U]);
    const obsId = one("SELECT last_insert_rowid() AS id").id;
    if (mk) {
      const [level,reason] = classifySeverity(t,h);
      const reg = one("SELECT region_id FROM WeatherStation WHERE station_id=?",[sid]).region_id;
      exec(`INSERT INTO HeatwavePrediction (region_id,obs_id,severity_id,temperature,humidity,wind_speed,reason,predicted_at) VALUES (?,?,?,?,?,?,?, datetime('now','-${days} days'))`,[reg,obsId,sevId[level],t,h,w,reason]);
      // trigger auto-creates WarningAlert for High/Extreme
    }
  });

  const compSpec = [
    ["priya","Water Shortage","No water supply for 2 days in our locality during peak heat.","Open",null,null,0],
    ["priya","Heat Illness","Elderly neighbour showing signs of heat exhaustion, need help.","In Progress","Health",off2,1],
    ["rahul","Power Outage","Frequent power cuts making it impossible to run fans/coolers.","Open","Electricity Board",null,0],
    ["sana","Water Shortage","Tanker did not arrive as scheduled this week.","Resolved","Water Supply",off1,3],
    ["dev","Public Cooling","Request for a public cooling center near the bus stand.","Open",null,null,2],
    ["rahul","Heat Illness","Need ORS packets distributed at the community hall.","In Progress","Health",off2,1]];
  compSpec.forEach(([u,cat,desc,status,dept,officer,days]) => {
    const rid = one("SELECT region_id FROM Citizen WHERE citizen_id=?",[citId[u]]).region_id;
    exec(`INSERT INTO Complaint (citizen_id,region_id,dept_id,assigned_officer_id,category,description,status,created_at,resolved_at) VALUES (?,?,?,?,?,?,?, datetime('now','-${days} days'), ${status==='Resolved'?"datetime('now')":"NULL"})`,
      [citId[u], rid, dept?deptId[dept]:null, officer, cat, desc, status]);
  });
  exec("INSERT INTO Notification (user_id,message) VALUES (?,?)",[adminU,"Welcome to the Heatwave Early Warning System."]);
}

// ---- Current-role helpers ----
function citizenOf(uid){ return one("SELECT * FROM Citizen WHERE user_id=?",[uid]); }
function officerOf(uid){ return one("SELECT o.*, d.name AS dept_name FROM Officer o JOIN GovernmentDepartment d ON d.dept_id=o.dept_id WHERE o.user_id=?",[uid]); }

// ---- Navigation ----
let currentView = 'dashboard';

function buildNav() {
  const menu = document.getElementById('mainmenu');
  const um = document.getElementById('usermenu');
  if (!currentUser) { menu.innerHTML=''; um.innerHTML=''; return; }
  const links = [["dashboard","Dashboard"],["weather","Weather"],["predictions","Predictions"],
    ["alerts","Alerts"],["complaints","Complaints"]];
  if (currentUser.role !== 'Citizen') links.push(["reports","Reports"]);
  if (currentUser.role === 'Administrator') { links.push(["dbadmin","DB Admin"]); links.push(["sql","SQL Console"]); }
  menu.innerHTML = links.map(([v,l]) =>
    `<li class="nav-item"><a class="nav-link ${v===currentView?'active':''}" href="#"
       onclick="go('${v}');return false;">${l}</a></li>`).join('');
  um.innerHTML = `<li class="nav-item navbar-user">
      <span class="navbar-user-name">${esc(currentUser.full_name)}</span>
      <span class="navbar-user-role">${currentUser.role}</span>
    </li>
    <li class="nav-item"><a class="nav-link" href="#" onclick="logout();return false;">Switch account</a></li>`;
}
function go(view){ currentView = view; buildNav(); (VIEWS[view]||VIEWS.dashboard)(); window.scrollTo(0,0); }
function logout(){ currentUser=null; buildNav(); loginScreen(); }
function loginAs(uid){ currentUser = one("SELECT * FROM User WHERE user_id=?",[uid]); go('dashboard'); }

function app(html){
  document.getElementById('app').innerHTML = html;
}
function sevBadge(l){
  // heatguard.css styles data-level="No data" on its own (muted), matching
  // the sev_tag() Jinja macro on the Flask side -- same markup, same CSS.
  return `<span class="sev-tag" data-level="${l}"><span class="sev-tag-mark"></span>${l}</span>`;
}

// ---- Login screen ----
function initials(name){ return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function loginScreen() {
  const users = run("SELECT * FROM User ORDER BY CASE role WHEN 'Administrator' THEN 1 WHEN 'Officer' THEN 2 ELSE 3 END, full_name");
  const meta = {
    Administrator: {cls:'adm', desc:'Full access, DB admin, reports'},
    Officer:       {cls:'off', desc:'Assigns and resolves complaints'},
    Citizen:       {cls:'cit', desc:'Files complaints, views alerts'}
  };
  const groups = [
    ['Administrator', 'Administrator'],
    ['Officer', 'Officers'],
    ['Citizen', 'Citizens'],
  ];

  function accountRow(u) {
    const m = meta[u.role];
    return `
      <a class="account-row" href="#" onclick="loginAs(${u.user_id});return false;">
        <div class="account-avatar ${m.cls}">${initials(u.full_name)}</div>
        <div class="account-meta">
          <div class="account-name">${esc(u.full_name)}</div>
          <div class="account-handle">@${esc(u.username)}</div>
          <div class="account-desc">${m.desc}</div>
        </div>
        <span class="account-role">${u.role}</span>
      </a>`;
  }

  app(`
   <div class="hero">
     <p class="eyebrow">DBMS Mini Project</p>
     <h1>HeatGuard</h1>
     <p>Pick an account to look around. Everything runs on a real SQLite database inside your
        browser, so feel free to break things &mdash; refresh the page to reset.</p>
   </div>
   <div class="account-section">
     ${groups.map(([role, label]) => {
        const rows = users.filter(u => u.role === role);
        if (!rows.length) return '';
        return `<p class="account-group-label">${label}</p>${rows.map(accountRow).join('')}`;
      }).join('')}
   </div>`);
}

// ---- Views ----
const VIEWS = {};

VIEWS.dashboard = function() {
  if (currentUser.role === 'Citizen') return citizenDashboard();
  if (currentUser.role === 'Officer') return officerDashboard();
  return adminDashboard();
};

function citizenDashboard() {
  const c = citizenOf(currentUser.user_id);
  const region = one("SELECT * FROM Region WHERE region_id=?",[c.region_id]);
  const pred = one("SELECT hp.*, s.level FROM HeatwavePrediction hp JOIN HeatwaveSeverity s ON s.severity_id=hp.severity_id WHERE hp.region_id=? ORDER BY hp.predicted_at DESC LIMIT 1",[c.region_id]);
  const alerts = run("SELECT wa.*, s.level FROM WarningAlert wa JOIN HeatwaveSeverity s ON s.severity_id=wa.severity_id WHERE wa.region_id=? AND wa.is_active=1 ORDER BY wa.issued_at DESC",[c.region_id]);
  const mine = run("SELECT * FROM Complaint WHERE citizen_id=? ORDER BY created_at DESC",[c.citizen_id]);
  const adv = pred ? (ADVISORIES[pred.level]||[]) : [];
  app(`
    ${pageHead('Your region: ' + esc(region.name) + ', ' + esc(region.state), 'Welcome, ' + esc(currentUser.full_name))}
    <div class="row g-3">
      <div class="col-md-6"><div class="card h-100"><div class="card-body">
        <h5 class="card-title">Current Heat Status</h5>
        ${pred ? `<p>Latest severity: ${sevBadge(pred.level)}</p>
          <p class="small text-muted">Recorded ${pred.temperature} °C, humidity ${pred.humidity}%, wind ${pred.wind_speed} km/h</p>
          <p class="small text-muted mono" title="${pred.predicted_at}">Assessed ${fmtDate(pred.predicted_at)}</p>`
          : `<p class="text-muted">No prediction yet.</p>`}
      </div></div></div>
      <div class="col-md-6"><div class="card h-100"><div class="card-body">
        <h5 class="card-title">Advisories</h5>${adv.length?`<ul class="mb-0">${adv.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:`<p class="text-muted mb-0">No advisories.</p>`}
      </div></div></div>
    </div>
    <div class="card mt-3"><div class="card-body">
      <h5 class="card-title">Active Warning Alerts for ${esc(region.name)}</h5>
      ${alerts.length?alerts.map(a=>`<div class="alert alert-warning mb-2">${sevBadge(a.level)} ${esc(a.message)}<div class="small text-muted mono" title="${a.issued_at}">Issued ${fmtDate(a.issued_at)}</div></div>`).join(''):`<p class="text-muted mb-0">No active alerts. Stay safe!</p>`}
    </div></div>
    <div class="card mt-3"><div class="card-body">
      <div class="d-flex justify-content-between"><h5 class="card-title mb-0">My Complaints</h5><button class="btn btn-sm btn-primary" onclick="go('complaints')">File / View</button></div>
      <table class="table table-sm mt-2"><thead><tr><th class="num">#</th><th>Category</th><th>Status</th><th>Filed</th></tr></thead><tbody>
      ${mine.length?mine.map(c=>`<tr><td class="num">${c.complaint_id}</td><td>${esc(c.category)}</td><td>${statusBadge(c.status)}</td><td class="small text-muted mono" title="${c.created_at}">${fmtDate(c.created_at)}</td></tr>`).join(''):`<tr class="empty-row"><td colspan="4">None yet.</td></tr>`}
      </tbody></table>
    </div></div>`);
}

function officerDashboard() {
  const o = officerOf(currentUser.user_id);
  const assigned = run(`SELECT c.*, r.name AS region_name, cu.full_name AS citizen_name,
      COALESCE(sev.rank,0) AS region_rank, COALESCE(sev.level,'Low') AS region_level

      </tbody></table></div></div></div>`);
};
function addObservation() {
  const sid = +document.getElementById('w_station').value;
  const t = parseFloat(document.getElementById('w_temp').value);
  const h = parseFloat(document.getElementById('w_hum').value);
  const w = parseFloat(document.getElementById('w_wind').value);
  if (isNaN(t)||isNaN(h)||isNaN(w)) { notice("Enter temperature, humidity and wind.", "warning"); return; }
  exec("INSERT INTO WeatherObservation (station_id,temperature,humidity,wind_speed,recorded_by) VALUES (?,?,?,?,?)",[sid,t,h,w,currentUser.user_id]);
  const obsId = one("SELECT last_insert_rowid() AS id").id;
  const reg = one("SELECT region_id FROM WeatherStation WHERE station_id=?",[sid]).region_id;
  runPrediction(reg, obsId, t, h, w);
  VIEWS.weather();
  notice("Weather observation recorded.", "success");
}
function runPrediction(regionId, obsId, t, h, w) {
  const [level,reason] = classifySeverity(t,h);
  const sid = one("SELECT severity_id, rank FROM HeatwaveSeverity WHERE level=?",[level]);
  exec("INSERT INTO HeatwavePrediction (region_id,obs_id,severity_id,temperature,humidity,wind_speed,reason) VALUES (?,?,?,?,?,?,?)",[regionId,obsId,sid.severity_id,t,h,w,reason]);
  // trigger creates the alert automatically for rank>=3
  return level;
}

  const canRun = currentUser.role !== 'Citizen';
  const regions = run("SELECT * FROM Region ORDER BY name");
  const preds = run("SELECT hp.*, r.name AS region_name, s.level FROM HeatwavePrediction hp JOIN Region r ON r.region_id=hp.region_id JOIN HeatwaveSeverity s ON s.severity_id=hp.severity_id ORDER BY hp.predicted_at DESC LIMIT 100");
  app(`
    ${pageHead('Module 3', 'AI Heatwave Predictions', 'Severity here comes from a rule-based expert system — fixed threshold rules on the latest observation, not a trained machine-learning model.')}
    ${canRun?`<div class="card mb-3"><div class="card-body"><h6 class="card-title">Run prediction for a region</h6>
      <div class="row g-2 align-items-end"><div class="col-auto"><label class="form-label">Region</label>

      <div class="col-auto"><button class="btn btn-sm btn-primary" onclick="runRegionPrediction()">Classify latest observation</button></div></div>

    </div></div>`:''}

      ${preds.map(p=>`<tr><td class="num">${p.prediction_id}</td><td>${esc(p.region_name)}</td><td>${sevBadge(p.level)}</td><td class="num">${p.temperature}</td><td class="num">${p.humidity}</td><td class="num">${p.wind_speed}</td><td class="small text-muted">${esc(p.reason)}</td><td class="small text-muted mono" title="${p.predicted_at}">${fmtDate(p.predicted_at)}</td></tr>`).join('')}
      </tbody></table></div></div></div>`);
};
function runRegionPrediction() {
  const reg = +document.getElementById('p_region').value;
  const obs = one("SELECT wo.* FROM WeatherObservation wo JOIN WeatherStation ws ON ws.station_id=wo.station_id WHERE ws.region_id=? ORDER BY wo.observed_at DESC LIMIT 1",[reg]);
  if (!obs) { notice("No observation for that region yet.", "warning"); return; }
  const level = runPrediction(reg, obs.obs_id, obs.temperature, obs.humidity, obs.wind_speed);
  VIEWS.predictions();
  notice("Prediction complete: severity classified as " + level + ".", "success");
}

let charts = [];
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function drawCharts() {

  Chart.defaults.borderColor = cssVar('--rule');
  Chart.defaults.font.family = 'IBM Plex Sans, system-ui, sans-serif';
  const SEV = {Low:cssVar('--sev-low'),Moderate:cssVar('--sev-moderate'),High:cssVar('--sev-high'),Extreme:cssVar('--sev-extreme')};
  const STATUS_COLORS = [cssVar('--status-open'),cssVar('--status-progress'),cssVar('--status-resolved')];
  const ACCENT = cssVar('--accent');
  const chartOpts = { responsive:true, maintainAspectRatio:false };
  const st = {}; run("SELECT status, COUNT(*) c FROM Complaint GROUP BY status").forEach(r=>st[r.status]=r.c);
  charts.push(new Chart(ch1,{type:'pie',data:{labels:['Open','In Progress','Resolved'],datasets:[{data:[st.Open||0,st['In Progress']||0,st.Resolved||0],backgroundColor:STATUS_COLORS}]},options:chartOpts}));
  const rg = run("SELECT region_name, total_complaints FROM v_region_complaint_summary ORDER BY total_complaints DESC");
  charts.push(new Chart(ch2,{type:'bar',data:{labels:rg.map(r=>r.region_name),datasets:[{label:'Complaints',data:rg.map(r=>r.total_complaints),backgroundColor:ACCENT}]},options:{...chartOpts,plugins:{legend:{display:false}}}}));
  const sv = run("SELECT s.level, COUNT(hp.prediction_id) c FROM HeatwaveSeverity s LEFT JOIN HeatwavePrediction hp ON hp.severity_id=s.severity_id GROUP BY s.level, s.rank ORDER BY s.rank");
  charts.push(new Chart(ch3,{type:'bar',data:{labels:sv.map(r=>r.level),datasets:[{label:'Predictions',data:sv.map(r=>r.c),backgroundColor:sv.map(r=>SEV[r.level]||'#999')}]},options:{...chartOpts,plugins:{legend:{display:false}}}}));
  const tr = run("SELECT date(predicted_at) d, COUNT(*) c FROM HeatwavePrediction GROUP BY date(predicted_at) ORDER BY d");
  charts.push(new Chart(ch4,{type:'line',data:{labels:tr.map(r=>r.d),datasets:[{label:'Predictions',data:tr.map(r=>r.c),borderColor:ACCENT,backgroundColor:ACCENT+'26',fill:true,tension:.3}]},options:chartOpts}));
}

VIEWS.dbadmin = function() {
  const tables = ["User","Region","HeatwaveSeverity","GovernmentDepartment","Citizen","Officer","Administrator","WeatherStation","WeatherObservation","HeatwavePrediction","Advisory","WarningAlert","Complaint","Notification"];
  app(`${pageHead('Module 8', 'Database Administration', 'Table row counts and CSV export (basic backup feature).')}
    <div class="card"><div class="card-body"><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Table</th><th class="num">Row count</th><th>Export</th></tr></thead><tbody>
    ${tables.map(t=>`<tr><td><code>${t}</code></td><td class="num">${one("SELECT COUNT(*) c FROM "+t).c}</td><td><button class="btn btn-sm btn-outline-success" onclick="exportCSV('${t}')">Download CSV</button></td></tr>`).join('')}
    </tbody></table></div></div></div>`);
};
function exportCSV(table) {
  const rows = run("SELECT * FROM "+table);
  let cols = rows.length ? Object.keys(rows[0]) : (run("PRAGMA table_info("+table+")").map(c=>c.name));
  const csv = [cols.join(',')].concat(rows.map(r=>cols.map(c=>{
    let v = r[c]==null?'':String(r[c]); if (/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v;
  }).join(','))).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = table+'.csv'; a.click();
}

VIEWS.sql = function() {
  app(`${pageHead('Module 8', 'SQL Console', 'Run any SQL against the in-browser SQLite database &mdash; great for demonstrating the schema, the view, and the trigger live in a viva.')}
    <div class="card mb-3"><div class="card-body">
      <label class="form-label" for="sqlbox">Statement</label>
      <textarea id="sqlbox" class="form-control font-monospace" rows="4">SELECT * FROM v_region_complaint_summary;</textarea>
      <div class="mt-2 d-flex gap-2 flex-wrap">
        <button class="btn btn-sm btn-primary" onclick="runSQL()">Run</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="sqlSample('SELECT name FROM sqlite_master WHERE type=\\'trigger\\';')">Show triggers</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="sqlSample('SELECT * FROM WarningAlert;')">Warning alerts (trigger output)</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="sqlSample('SELECT sql FROM sqlite_master WHERE type=\\'view\\';')">View definition</button>
      </div>
    </div></div>
    <div id="sqlresult"></div>`);
};
function sqlSample(q){ document.getElementById('sqlbox').value = q; runSQL(); }
function runSQL() {
  const q = document.getElementById('sqlbox').value;
  const out = document.getElementById('sqlresult');
  try {
    const res = db.exec(q);
    if (!res.length) { out.innerHTML = `<div class="alert alert-success">Statement executed. No rows returned.</div>`; return; }
    const {columns, values} = res[0];
    out.innerHTML = `<div class="card"><div class="card-body"><div class="table-responsive"><table class="table table-sm"><thead><tr>${columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${values.map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small text-muted mb-0">${values.length} row(s).</p></div></div>`;
  } catch(e) {
    out.innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`;
  }
}

// ---- fmtDate: mirrors the `when` Jinja filter in app.py, so both
// frontends show the same relative/absolute timestamp style. ----
function fmtDate(value) {
  if (!value) return '-';
  // SQLite's datetime('now') is UTC with no 'T'/'Z'; add them so every
  // browser's Date parser reads it as UTC instead of guessing local time.
  const dt = new Date(value.replace(' ', 'T') + 'Z');
  if (isNaN(dt.getTime())) return value;
  const seconds = (Date.now() - dt.getTime()) / 1000;
  if (seconds < 60) return 'just now';
  if (seconds < 3600) return Math.floor(seconds/60) + ' min ago';
  if (seconds < 86400) return Math.floor(seconds/3600) + ' hr ago';
  if (seconds < 7*86400) { const d = Math.floor(seconds/86400); return d===1 ? '1 day ago' : d+' days ago'; }
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let out = `${dt.getDate()} ${months[dt.getMonth()]}`;
  if (dt.getFullYear() !== new Date().getFullYear()) out += ` ${dt.getFullYear()}`;
  const hh = String(dt.getHours()).padStart(2,'0'), mm = String(dt.getMinutes()).padStart(2,'0');
  return `${out}, ${hh}:${mm}`;
}

// ---- notice: a fixed-position banner matching the Flask flash look,     ----
// ---- replacing alert() so the demo doesn't block on native dialogs.    ----
let noticeTimer = null;
function notice(message, kind='info') {
  let el = document.getElementById('notice');
  if (!el) {
    el = document.createElement('div');
    el.id = 'notice';
    document.body.appendChild(el);
  }
  el.className = `notice-banner alert alert-${kind}`;
  el.textContent = message;
  el.style.display = 'block';
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { el.style.display = 'none'; }, 3200);
}
