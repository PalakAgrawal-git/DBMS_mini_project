{% extends "base.html" %}
{% from "_macros.html" import page_head %}
{% block title %}Login &mdash; HeatGuard{% endblock %}
{% block content %}
{{ page_head("Welcome back", "Login") }}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required>
          </div>
          <button class="btn btn-primary w-100">Login</button>
        </form>
        <hr>
        <p class="mb-1 small text-muted">No account? <a href="{{ url_for('register') }}">Register here</a>.</p>
        <p class="mb-0 small text-muted">
          Demo logins (password <code>pass123</code>):
          <code>admin</code>, <code>officer1</code>, <code>priya</code>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
